// A DNS server for the RFC 2136 DNS Provider's tests: dynamic updates signed with a TSIG key are accepted for
// rfc2136.test; readonly.test takes none. The key's secret is a test value; nothing real is behind it.
options {
  directory "/var/cache/bind";
  listen-on port 53 { any; };
  listen-on-v6 { none; };
  recursion no;
  allow-query { any; };
  allow-transfer { none; };
  dnssec-validation no;
};

key "certs-test." {
  algorithm hmac-sha256;
  secret "dGVzdC10c2lnLWtleS1mb3ItdGhlLXJmYzIxMzYtdGVzdHM=";
};

// One key per other TSIG algorithm, each allowed to update only the name that is its own: <algorithm>.rfc2136.test.
// They share one secret. That each is refused anywhere else is something the tests rely on.
key "sha1-key." { algorithm hmac-sha1; secret "b3RoZXItc2VjcmV0LWZvci10aGUtb3RoZXItYWxnb3JpdGhtcw=="; };
key "sha384-key." { algorithm hmac-sha384; secret "b3RoZXItc2VjcmV0LWZvci10aGUtb3RoZXItYWxnb3JpdGhtcw=="; };
key "sha512-key." { algorithm hmac-sha512; secret "b3RoZXItc2VjcmV0LWZvci10aGUtb3RoZXItYWxnb3JpdGhtcw=="; };
key "md5-key." { algorithm hmac-md5; secret "b3RoZXItc2VjcmV0LWZvci10aGUtb3RoZXItYWxnb3JpdGhtcw=="; };

zone "rfc2136.test" {
  type master;
  file "/var/cache/bind/rfc2136.test.db";
  update-policy {
    grant certs-test. zonesub TXT;
    grant sha1-key. name sha1.rfc2136.test. TXT;
    grant sha384-key. name sha384.rfc2136.test. TXT;
    grant sha512-key. name sha512.rfc2136.test. TXT;
    grant md5-key. name md5.rfc2136.test. TXT;
  };
};

zone "readonly.test" {
  type master;
  file "/var/cache/bind/readonly.test.db";
};
