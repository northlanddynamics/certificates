services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certs_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Let's Encrypt's ACME test server, the CA in tests. Its directory is https://localhost:14000/dir, served with a
  # certificate from the minica root in server/test/pebble/minica.pem.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /test/config/pebble-config.json
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      - "14000:14000"

  # An RFC 2136 DNS server (BIND), the DNS Provider's counterpart in tests: its zone rfc2136.test accepts dynamic updates
  # signed with the TSIG key in docker/bind/named.conf. Served on localhost:5354, TCP and UDP.
  bind:
    build: docker/bind
    ports:
      - "5354:53/tcp"
      - "5354:53/udp"

volumes:
  pgdata:
