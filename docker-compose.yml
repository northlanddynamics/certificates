services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certs_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Let's Encrypt's ACME test server, the CA in tests. Its directory is https://localhost:14000/dir, served with a
  # certificate from the minica root in server/test/support/pebble/minica.pem. It checks DNS-01 challenges against BIND, so
  # a record the platform publishes there through RFC 2136 is the one the CA sees.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /test/config/pebble-config.json -dnsserver bind:53
    depends_on:
      - bind
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      # Never reuse a valid authorization: a second order for a name must prove control again, or tests that depend on that are flaky.
      PEBBLE_AUTHZREUSE: "0"
    ports:
      - "14000:14000"
      # Its management interface, from which tests read the root its chains end in (/roots/0).
      - "15000:15000"

  # A second Pebble that requires External Account Binding, as some commercial CAs do: its directory is
  # https://localhost:14001/dir, and it registers only an account bound with the key id and HMAC key in
  # docker/pebble-eab/pebble-config.json (the tests' PEBBLE_EAB_KEY). Only registration is tested against it.
  pebble-eab:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /eab/pebble-config.json -dnsserver bind:53
    depends_on:
      - bind
    volumes:
      - ./docker/pebble-eab:/eab:ro
    ports:
      - "14001:14000"

  # An RFC 2136 DNS server (BIND), the DNS Provider's counterpart in tests: its zone rfc2136.test accepts dynamic updates
  # signed with the TSIG key in docker/bind/named.conf. Served on localhost:5354, TCP and UDP. The names under delegating.test
  # delegate their _acme-challenge to validation.rfc2136.test by CNAME, for the Delegated DCV tests. It is recursive, so the
  # CA's lookups follow that CNAME. Its config is a volume of the image: after changing docker/bind, recreate it with
  # `docker compose up -d --build --force-recreate --renew-anon-volumes bind`, or the old files stay.
  bind:
    build: docker/bind
    ports:
      - "5354:53/tcp"
      - "5354:53/udp"

  # micromdm/scep's SCEP client, built from source (docker/scepclient), for the test that a real third-party client
  # enrolls against the platform: `docker compose run --rm scepclient -server-url <SCEP URL> ...` prints the certificate it
  # was issued. It reaches the tests' app on the host as host.docker.internal. Run only on demand, never by `up`.
  scepclient:
    build: docker/scepclient
    profiles: ["interop"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
