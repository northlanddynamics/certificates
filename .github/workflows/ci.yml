name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: certs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/certs_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generated schema and migrations are up to date
        run: |
          bun run auth:generate
          bun run db:generate
          git diff --exit-code -- server/src/db server/drizzle
          test -z "$(git status --porcelain server/drizzle)"
      # The tests' other servers: Pebble (the CA) and BIND (an RFC 2136 DNS server), from docker-compose.yml.
      # Postgres is the service container above, so only these two are started.
      - name: Start Pebble and BIND
        run: |
          docker compose up -d --build pebble bind
          for i in $(seq 1 60); do
            curl -ksf https://localhost:14000/dir >/dev/null && (echo > /dev/tcp/127.0.0.1/5354) 2>/dev/null && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
